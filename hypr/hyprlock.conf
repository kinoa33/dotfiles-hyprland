# hyprlock: Gregorian date on top, 12h clock, password field (all with shadow)
$font   = Pixel Code
$shadow = rgba(000000dd)   # change to rgba(cba6f7aa) for a neon glow instead

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    brightness = 0.55
}

# Gregorian date (top)
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_ALL=C date +'%A  |  %d %B %Y')"
    color = rgba(cba6f7ff)
    font_size = 26
    font_family = $font
    shadow_passes = 3
    shadow_size = 6
    shadow_color = $shadow
    shadow_boost = 1.4
    position = 0, 170
    halign = center
    valign = center
}

# 12-hour clock
label {
    monitor =
    text = cmd[update:1000] echo "$(LC_ALL=C date +'%I:%M %p')"
    color = rgba(e7e6edff)
    font_size = 140
    font_family = $font
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $shadow
    shadow_boost = 1.6
    position = 0, 40
    halign = center
    valign = center
}

# password field with shadow
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(e7e6ed66)
    inner_color = rgba(00000055)
    font_color = rgba(e7e6edff)
    font_family = $font
    check_color = rgba(cba6f7ff)
    fail_color = rgba(e64553ff)
    capslock_color = rgba(cba6f7ff)
    fade_on_empty = false
    rounding = 14
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    hide_input = false
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $shadow
    shadow_boost = 1.4
    position = 0, -90
    halign = center
    valign = center
} 
