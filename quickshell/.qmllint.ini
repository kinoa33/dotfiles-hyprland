; qmllint settings for every quickshell config here (tools/lint.sh runs it).
; switched off: warnings that are noise for quickshell, not bugs —
;   UnqualifiedAccess    delegates reading their parent's ids (works, and is the house style)
;   UncreatableType      PanelWindow/FloatingWindow are created by quickshell itself
;   UnresolvedType       quickshell's grouped `margins` type isn't in the lint metadata
;   BadSignalHandlerParameters   Process.onExited's QProcess types aren't either
[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
UnqualifiedAccess=disable
UncreatableType=disable
UnresolvedType=disable
BadSignalHandlerParameters=disable
UnusedImports=warning
